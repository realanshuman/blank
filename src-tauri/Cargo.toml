[package]
name = "blank"
version = "0.1.3"
description = "A blank canvas for freewriting"
authors = ["Blank"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "blank_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
# `watch` is a Cargo feature, not a JS-side option. The JS watch() functions
# exist and typecheck without it, then fail at runtime — a silent trap.
tauri-plugin-fs = { version = "2", features = ["watch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Folder access granted through the dialog is a RUNTIME scope grant, and it
# evaporates on restart. Without this plugin the user re-picks their folder on
# every single launch.
tauri-plugin-persisted-scope = "2"
tauri-plugin-window-state = "2"

[features]
# Used by the Tauri CLI for production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
