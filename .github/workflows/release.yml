name: Release

# Tag a version to cut a release:
#   npm version 0.1.1 && git push --follow-tags
# Or run this manually from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Created if missing.'
        required: true
        default: 'v0.1.0'
      prerelease:
        description: 'Mark as a pre-release. GitHub keeps releases/latest off these, so the download link on the landing page stays on the last stable build.'
        type: boolean
        required: false
        default: false

# The release job pushes a GitHub Release, so it needs write access.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # One platform failing should not throw away binaries that did build.
      fail-fast: false
      matrix:
        include:
          # Universal binary covers both Apple Silicon and Intel Macs in one
          # .app, so there is only one download for users to choose from.
          - platform: macos-14
            target: universal-apple-darwin
            label: macOS
          - platform: windows-latest
            target: ''
            label: Windows
          # Built on the oldest supported Ubuntu on purpose: glibc is forward
          # compatible but not backward, so a 24.04 binary will not start on
          # 22.04 while this one runs on both.
          - platform: ubuntu-22.04
            target: ''
            label: Linux

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    env:
      # Signing is enabled only when a certificate actually exists. See the
      # "Enable Apple code signing" step for why this matters.
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            pkg-config

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Both targets are required for the universal macOS binary.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust builds are slow from cold; this takes repeat runs from ~15 min to
      # a few minutes.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ${{ matrix.platform }}-${{ matrix.target }}

      - run: npm ci

      # Fail before the slow Rust compile if the web layer is broken.
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run test

      # Tauri reads APPLE_CERTIFICATE with std::env::var_os, which returns
      # Some("") for a variable that is DEFINED BUT EMPTY — as an unset GitHub
      # secret is. It then tries to import a blank certificate and the bundle
      # step dies. So the variables must not exist at all unless signing is
      # genuinely configured, which is why they are written here rather than
      # passed unconditionally in the build step's env block.
      - name: Enable Apple code signing
        if: matrix.platform == 'macos-14' && env.HAS_APPLE_CERT == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE<<__EOF__"
            echo "${{ secrets.APPLE_CERTIFICATE }}"
            echo "__EOF__"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Blank __VERSION__'
          releaseBody: |
            Download the file for your platform below.

            - **macOS** — `.dmg`. Works on both Apple Silicon and Intel.
            - **Windows** — `.msi` or the `.exe` setup.
            - **Linux** — `.AppImage` or `.deb`.

            These builds are unsigned unless signing secrets are configured, so
            the first launch is blocked. This is expected.

            **macOS** — click **Done** (not "Move to Bin"), then open
            **System Settings → Privacy & Security**, scroll to Security and click
            **Open Anyway** next to Blank. Once only. Note the older
            right-click → Open trick no longer works on macOS 15 and later.

            **Windows** — click **More info → Run anyway**.
          # Published, not draft: a draft release's assets 404 for anyone who is
          # not the repo owner, which would break the download link on the site.
          releaseDraft: false
          # A test build cut from a branch must not become releases/latest:
          # that is what the landing page's download button resolves to, so
          # every visitor would get the experimental one.
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}
